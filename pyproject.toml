[tool.poetry]
name = "map2poster"
version = "0.2.3"
description = "A Flask web app to generate maps as poster-ready images."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "map_handler", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.3"
osmnx = "^2.1.0"
matplotlib = "^3.9.2"
pandas = "^2.2.3"
pillow = "^11.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
